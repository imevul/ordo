# Ordo — production stack. Configure via .env (see .env.example).
name: ordo

services:
  app:
    build:
      context: .
      # Proxies for the build (pnpm install); unset ones fall back to Docker's own proxy config.
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    image: ordo:${ORDO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ordo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ordo}
      ORDO_PUBLIC_URL: ${ORDO_PUBLIC_URL:-http://localhost:3000}
      ORDO_SECRET_KEY: ${ORDO_SECRET_KEY:?Run `make update` to add ORDO_SECRET_KEY to .env}
      ORDO_SECRET_KEY_PREVIOUS: ${ORDO_SECRET_KEY_PREVIOUS:-}
      # Empty means "managed in Admin → Settings"; a value here pins the setting.
      ORDO_SIGNUP_MODE: ${ORDO_SIGNUP_MODE:-}
      ORDO_ALLOW_WORKSPACE_CREATION: ${ORDO_ALLOW_WORKSPACE_CREATION:-}
      ORDO_ALLOW_PRIVATE_NETWORK_TARGETS: ${ORDO_ALLOW_PRIVATE_NETWORK_TARGETS:-}
      ORDO_TRUST_PROXY: ${ORDO_TRUST_PROXY:-true}
      # Outgoing mail; leave empty to configure it in Admin → Settings instead.
      ORDO_SMTP_URL: ${ORDO_SMTP_URL:-}
      ORDO_SMTP_FROM: ${ORDO_SMTP_FROM:-}
      # AI assistance; leave empty to configure it in Admin → Settings (docs/ai.md).
      ORDO_AI_PROVIDER: ${ORDO_AI_PROVIDER:-}
      ORDO_AI_MODEL: ${ORDO_AI_MODEL:-}
      ORDO_AI_BASE_URL: ${ORDO_AI_BASE_URL:-}
      ORDO_AI_API_KEY: ${ORDO_AI_API_KEY:-}
      # Uploads: local (the ordo-data volume) or s3.
      ORDO_STORAGE: ${ORDO_STORAGE:-local}
      ORDO_S3_ENDPOINT: ${ORDO_S3_ENDPOINT:-}
      ORDO_S3_REGION: ${ORDO_S3_REGION:-}
      ORDO_S3_BUCKET: ${ORDO_S3_BUCKET:-}
      ORDO_S3_ACCESS_KEY_ID: ${ORDO_S3_ACCESS_KEY_ID:-}
      ORDO_S3_SECRET_ACCESS_KEY: ${ORDO_S3_SECRET_ACCESS_KEY:-}
      ORDO_S3_FORCE_PATH_STYLE: ${ORDO_S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Outgoing HTTP(S) proxy (OAuth/SSO, webhooks, integrations, AI). Passed through only when set.
      HTTP_PROXY:
      HTTPS_PROXY:
      NO_PROXY:
    volumes:
      - ordo-data:/data
    # Lets Ordo reach services on the host, such as a local Ollama for AI assistance.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ORDO_BIND:-0.0.0.0}:${ORDO_PORT:-3000}:3000"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ordo}
    volumes:
      - ordo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ordo-db:
  ordo-data:
